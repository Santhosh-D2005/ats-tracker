/* ---------- File reading ---------- */
function buildLines(items){
  const arr=items.filter(i=>i.str!=="").map(i=>({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width,h:Math.max(i.height||10,6)}));
  arr.sort((a,b)=>b.y-a.y||a.x-b.x);
  const lines=[];
  for(const it of arr){
    const last=lines[lines.length-1];
    if(last&&Math.abs(last.y-it.y)<=Math.max(2,it.h*0.4)) last.items.push(it); else lines.push({y:it.y,items:[it]});
  }
  return lines.map(l=>{
    l.items.sort((a,b)=>a.x-b.x);
    let str="",segs=[],cur=null,prevEnd=null;
    for(const it of l.items){
      if(prevEnd===null){cur={x:it.x};str=it.s}
      else{
        const gap=it.x-prevEnd;
        if(gap>it.h*1.8){segs.push(cur);cur={x:it.x};str+="   "+it.s}
        else{ if(gap>it.h*0.12&&!/\s$/.test(str)&&!/^\s/.test(it.s)) str+=" "; str+=it.s }
      }
      prevEnd=it.x+it.w;
    }
    segs.push(cur);
    return {text:str.replace(/\s+$/,""),segs};
  });
}
async function readPdf(file){
  if(!window.pdfjsLib) throw new Error("The PDF reader could not load. Check your connection or paste the text instead.");
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  let out=[],links=[],colLines=0;
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p);
    const vw=page.getViewport({scale:1}).width;
    const tc=await page.getTextContent();
    const lines=buildLines(tc.items);
    for(const l of lines){
      out.push(l.text);
      if(l.segs.length>=2&&l.segs[1].x>vw*0.33&&l.segs[1].x<vw*0.62) colLines++;
    }
    try{const an=await page.getAnnotations();an.forEach(a=>{if(a.url)links.push(a.url)})}catch(e){}
  }
  return {text:out.join("\n"),meta:{pages:doc.numPages,columns:colLines>=6,links,tables:0,images:0,type:"pdf"}};
}
async function readDocx(file){
  if(!window.mammoth) throw new Error("The DOCX reader could not load. Paste the text instead.");
  const buf=await file.arrayBuffer();
  const raw=await mammoth.extractRawText({arrayBuffer:buf});
  const html=await mammoth.convertToHtml({arrayBuffer:buf});
  const links=[...html.value.matchAll(/href="([^"]+)"/g)].map(m=>m[1]);
  return {text:raw.value.replace(/\n{2,}/g,"\n"),meta:{pages:null,columns:false,links,tables:(html.value.match(/<table/g)||[]).length,images:(html.value.match(/<img/g)||[]).length,type:"docx"}};
}
async function readAny(file){
  const n=file.name.toLowerCase();
  if(n.endsWith(".pdf")) return readPdf(file);
  if(n.endsWith(".docx")) return readDocx(file);
  if(n.endsWith(".txt")) return {text:await file.text(),meta:{pages:null,columns:false,links:[],tables:0,images:0,type:"txt"}};
  throw new Error("Unsupported file type. Use PDF, DOCX or TXT.");
}

function titleLike(t,marked,wc){
  if(marked) return false;
  if(t.indexOf(" | ")>=0) return true;
  if(wc>14||/[.;]$/.test(t)) return false;
  return t.split(/\s+/).filter(w=>/^[A-Z(]/.test(w)).length/wc>=0.6;
}

  const lines=text.split("\n").map(l=>l.replace(/\s+$/,"")).filter(l=>l.trim());

  const secs={};let curSec="_top";secs[curSec]=[];const headingLines=[];const unknownHeads=[];

  /* FORMAT */
  const tooLittle=words<60;
  if(tooLittle){
    add("format","critical","No readable text found","The parser extracted only "+words+" words. This usually means the PDF is a scan or an image export, so the ATS sees an empty resume and rejects it automatically.","Export from Word or Google Docs with Save as PDF (not Print to image or a screenshot). Text should be selectable when you drag over it.",20);
  } else ok("format","Text extracts cleanly ("+words+" words)");
  if(meta.columns){
    add("format","critical","Multi-column layout detected","Several lines have text starting mid-page. Parsers read straight across the page, so left-column and right-column content get interleaved and sections come out scrambled.","Rebuild in a single column. Keep dates right-aligned on the same line as the title if you like, but move skills and contact sidebars into normal sections.",6);
  } else if(!tooLittle&&meta.type==="pdf") ok("format","Single-column reading order");
  if(meta.tables>0) add("format","warning","Tables found in the document",meta.tables+" table(s) detected. Many ATS read table cells out of order or skip them.","Replace tables with plain lines and bullets.",5);
  if(meta.images>0) add("format","warning","Images or graphics found",meta.images+" image(s) detected. Text inside images is invisible to the ATS and logos or icons add parsing noise.","Remove photos, logos, skill bars and icon graphics. Use text only.",4);
  const weird=(flat.match(/[\uE000-\uF8FF\uFFFD]/g)||[]).length;
  if(weird>0) add("format","warning","Unreadable symbols in extracted text",weird+" private-use or broken characters came through. These are icon fonts (phone, mail, bullet symbols) that the ATS cannot decode.","Use standard bullets (•) and write the words out, for example Phone: or Email:, or drop the icons.",4);
  else if(!tooLittle) ok("format","No icon-font or broken characters");
  if(meta.pages&&meta.pages>2) add("format","warning","Resume is "+meta.pages+" pages","Recruiters and ATS rank views favour one to two pages. Long resumes dilute keyword density.","Cut to two pages maximum, one for under 10 years of experience.",3);
  else if(meta.pages) ok("format",meta.pages+" page"+(meta.pages>1?"s":"")+" long");
  if(!tooLittle&&words<250) add("format","warning","Resume is very short ("+words+" words)","Thin resumes give the ATS too little to match against a job description.","Aim for 350 to 700 words. Add detail to projects, internships and a dedicated skills section.",4);
  else if(words>950) add("format","warning","Resume is long ("+words+" words)","Very dense resumes lower keyword relevance and are often truncated by parsers.","Trim to the most recent and relevant 700 words.",3);
  if(fileName&&/[()\s]|fwd|copy|final|new/i.test(fileName.replace(/\.[^.]+$/,""))&&!/^[A-Za-z]+_[A-Za-z]+_?[A-Za-z_]*$/.test(fileName.replace(/\.[^.]+$/,""))){
    add("format","tip","File name looks unprofessional","\""+fileName+"\" contains spaces, brackets or words like FWD/copy. Recruiters see this name in the ATS record and some systems mishandle special characters.","Rename to FirstName_LastName_Resume.pdf.",1);
  }

  /* CONTACT */
  const email=(all.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/)||[])[0];
  let phone=null;for(const m of all.matchAll(/\+?\d[\d\s().-]{8,15}\d/g)){const d=m[0].replace(/\D/g,"");if(d.length>=10&&d.length<=13&&!/^(19|20)\d{2}/.test(d)){phone=m[0].trim();break}}
  const linkedin=(all.match(/linkedin\.com\/(in|pub)\/[\w%-]+/i)||[])[0];
  const github=(all.match(/github\.com\/[\w-]+/i)||[])[0];
  const first=lines[0]||"";
  const nameOk=/^[A-Za-z][A-Za-z.'\- ]{2,40}$/.test(first)&&first.trim().split(/\s+/).length>=2&&first.trim().split(/\s+/).length<=4;
  if(!email) add("contact","critical","No email address found","An ATS creates the candidate record from the email. Without one, the application can be dropped or sent to a duplicate-review queue.","Put a plain-text email in the first few lines, not in a header or text box.",4); else ok("contact","Email found ("+email+")");
  if(!phone) add("contact","critical","No phone number found","Recruiters filter on phone presence and many systems mark the profile incomplete.","Add a phone number with country code in the header, for example +91 98765 43210.",3); else ok("contact","Phone found ("+phone+")");
  if(!nameOk) add("contact","warning","Name not clearly on the first line","The ATS takes the first line as the candidate name. Found: \""+first.slice(0,40)+"\".","Make the first line your full name only, with no title or contact details beside it.",1.5); else ok("contact","Name on first line ("+first.trim()+")");
  if(!linkedin){
    if(/linkedin/i.test(all)) add("contact","warning","LinkedIn appears as a word, not a URL","The text says LinkedIn but no profile address was readable. Many ATS ignore hyperlink targets and only read visible text.","Show the full address, for example linkedin.com/in/yourname.",1.5);
    else add("contact","warning","No LinkedIn profile","Recruiters cross-check the ATS record with LinkedIn.","Add linkedin.com/in/yourname in the header.",1.5);
  } else ok("contact","LinkedIn URL readable");
  if(github) ok("contact","Code or portfolio link present");
  else if(/github/i.test(all)) add("contact","warning","GitHub appears as a word, not a URL","No profile address was readable. The label may be a hyperlink the ATS does not follow.","Write the full URL, github.com/yourname.",1);
  else if(!/portfolio|behance|\.dev|\.io/i.test(all)) add("contact","tip","No GitHub or portfolio link","For technical roles a code link supports your project claims.","Add github.com/yourname as visible text.",0.5);
  else if(/github/i.test(all)&&!github) add("contact","warning","GitHub appears as a word, not a URL","No profile address was readable.","Write the full URL, github.com/yourname.",1);
  else ok("contact","Code or portfolio link present");
  const hdrRest=lines.slice(1,4).join(" ").replace(/[A-Za-z0-9._%+-]+@\S+/g,"").replace(/\+?\d[\d\s().-]{8,15}\d/g,"").replace(/\S*(linkedin|github)\S*/gi,"");
  if(!/[A-Z][a-z]{3,}/.test(hdrRest)&&!/\b(remote|india|usa|uk)\b/i.test(hdrRest)) add("contact","tip","No clear location","Location filters are common in ATS searches.","Add City, State or City, Country in the header.",0.5);

  /* SECTIONS */
  const has=k=>!!secs[k]&&secs[k].length>0;
  const hasHead=k=>headingLines.some(x=>x.key===k);
  if(!hasHead("experience")){
    if(hasHead("projects")||/intern/i.test(all)) add("sections","warning","No standard Experience heading","Experience is the most weighted section. Without a heading the ATS may leave your work history empty.","Add a heading named Experience (or Work Experience). Put internships, training and industry roles under it.",3);
    else add("sections","critical","No Experience section","The ATS finds no work history, which triggers knockout filters for most roles.","Add an Experience section. If you are a fresher, list internships, training and freelance work there.",5);
  } else ok("sections","Experience heading recognised");
  if(!hasHead("education")) add("sections","critical","No Education section","Degree is a common knockout filter and cannot be inferred from other text.","Add an Education heading with degree, institution and graduation month and year.",4); else ok("sections","Education heading recognised");
  if(!hasHead("skills")){
    const inline=/skills\s*:/i.test(all);
    add("sections","warning","No standalone Skills section",inline?"A Skills: line exists but sits under another heading, so the ATS does not map it to the skills field recruiters search.":"The ATS skills field stays empty, so keyword searches miss you.","Create a Skills heading of its own with a comma-separated list, grouped as Languages, Frameworks, Tools.",3);
  } else ok("sections","Skills heading recognised");
  if(!hasHead("summary")) add("sections","tip","No summary at the top","A two-line summary gives the parser early keyword hits and tells a recruiter your target role.","Add a Summary with your role, 3 to 4 core skills and one result.",1); else ok("sections","Summary present");
  if(!hasHead("projects")&&!hasHead("experience")) add("sections","tip","No Projects section","Projects prove skills when work history is short.","Add 2 or 3 projects with a tech stack and outcome.",0);
  const uniqUnknown=[...new Set(unknownHeads)].slice(0,3);
  if(uniqUnknown.length) add("sections","warning","Non-standard headings: "+uniqUnknown.join(", "),"Creative headings are filed under Other and their content may not be scored.","Rename to standard headings: Summary, Experience, Education, Skills, Projects, Certifications.",Math.min(2,uniqUnknown.length));
  const addl=headingLines.find(x=>/additional/i.test(x.line));
  if(addl&&hasHead("skills")===false) add("sections","tip","Important details under Additional Information","Content under this heading is low-weight in most parsers.","Move skills, certifications and languages to their own headings.",0);

  /* CONTENT */
  const bulletSecs=["experience","projects"].filter(k=>secs[k]);
  let bullets=[];
  bulletSecs.forEach(k=>{
    let prev=null;
    secs[k].forEach(ln=>{
      const t=ln.replace(/^\s*[•●▪◦\-–—*·►✓➢]\s*/,"").trim();
      const wc=t.split(/\s+/).length;
      const isMarked=/^\s*[•●▪◦\-–—*·►✓➢]/.test(ln);
      const dateLine=/(19|20)\d{2}|present|current/i.test(t)&&wc<10;
      if(prev&&!isMarked&&(/^[a-z]/.test(t)||(wc<4&&/\.$/.test(t)&&!/[.!]$/.test(prev.t)))){prev.t+=" "+t;return}
      const titleLine=(t===t.toUpperCase()&&/[A-Z]{3}/.test(t))||/\b\d+\s*(months?|years?|yrs?)\s*$/i.test(t)||(!isMarked&&wc<9&&!/[.;:,]/.test(t)&&/^([A-Z][A-Za-z&\/().-]*\s?)+$/.test(t.replace(/[–—-]/g," ")));
      if(wc>=5&&!dateLine&&!titleLine&&!titleLike(t,isMarked,wc)){prev={t,sec:k};bullets.push(prev)} else prev=null;
    });
  });
  // if a line holds several sentences with no bullets, split them
  const split=[];bullets.forEach(b=>{const parts=b.t.split(/(?<=[.!])\s+(?=[A-Z])/);parts.forEach(p=>{if(p.trim().split(/\s+/).length>=3)split.push({t:p.trim(),sec:b.sec})})});
  if(split.length>bullets.length) bullets=split;

  if(nb){
    const strong=bullets.filter(b=>{const w=b.t.split(/\s+/)[0].toLowerCase().replace(/[^a-z]/g,"");return VERBS.has(w)||(/ed$/.test(w)&&w.length>4&&!/^(used|based|related|involved|focused)$/.test(w))});
    bullets.forEach(b=>{b.verb=strong.includes(b)});
    const ratio=strong.length/nb;
    if(ratio<0.6){
      const weakEx=bullets.filter(b=>!strong.includes(b)).slice(0,2).map(b=>"\""+b.t.slice(0,70)+(b.t.length>70?"...":"")+"\"").join("; ");
      add("content","warning","Only "+Math.round(ratio*100)+"% of bullets start with an action verb","Bullets that start with nouns or \"Responsible for\" read as duties, not achievements. Examples: "+weakEx,"Start every bullet with a past-tense verb such as Built, Reduced, Automated, Led, Deployed.",+(4*(0.6-ratio)/0.6).toFixed(1)+1);
    } else ok("content","Bullets lead with action verbs ("+Math.round(ratio*100)+"%)");
    const noDate=t=>t.replace(/\b(19|20)\d{2}\b/g,"").replace(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*/gi,"");
    const metric=bullets.filter(b=>/(\d+\s?%|[$₹€£]\s?\d|\d+\s?\+|(?<![A-Za-z-])\b\d{2,}\b|\b\d+x\b|\b\d+\s?(users|clients|students|records|requests|apis|endpoints|problems|projects|hours|members|tests|defects|reports|customers|vehicles|parts)\b)/i.test(noDate(b.t)));
    bullets.forEach(b=>{b.metric=metric.includes(b)});
    const mr=metric.length/nb;
    if(mr<0.3) add("content","warning",metric.length+" of "+nb+" bullets include a number","Quantified results are the strongest ranking signal after keywords, and recruiters scan for them.","Add a figure to each bullet: scale (500 records), speed (cut load time 40%), volume (30+ problems), or time saved.",+(5*(0.3-mr)/0.3).toFixed(1)+0.5);
    else ok("content","Bullets include measurable results");
    const longB=bullets.filter(b=>b.t.split(/\s+/).length>35).length;
    if(longB) add("content","warning",longB+" bullet"+(longB>1?"s are":" is")+" over 35 words","Long bullets bury keywords and get truncated in recruiter previews.","Keep each bullet to one line or two, 15 to 25 words.",1.5);
  }
  const weakHit=WEAK.filter(r=>r.test(flat)).map(r=>flat.match(r)[0].toLowerCase());
  if(weakHit.length) add("content","warning","Weak or filler phrases: "+[...new Set(weakHit)].join(", "),"These phrases describe tasks, not impact, and add no searchable keywords.","Replace \"Responsible for developing\" with \"Developed\", and \"Worked on\" with a specific verb plus result.",Math.min(2,weakHit.length)); else if(nb) ok("content","No filler phrases");
  if(/\b(I|my|me)\b/.test(flat.replace(/\bI\/O\b/g,""))) add("content","warning","First-person language","Resumes are written without I, my or me. First person reads as informal to ATS-ranked recruiters.","Drop the pronouns: \"Built a ...\" instead of \"I built my ...\".",2); else if(!tooLittle) ok("content","No first-person pronouns");
  const typos=Object.keys(MISSPELL).filter(w=>new RegExp("\\b"+w+"\\b","i").test(flat));
  if(typos.length) add("content","warning","Spelling errors: "+typos.map(w=>w+" → "+MISSPELL[w]).join(", "),"A misspelled keyword will not match a search for the correct spelling, and typos drop recruiter trust.","Fix the spelling and run a spell check on the final file.",Math.min(3,typos.length*1.5));
  else if(!tooLittle) ok("content","No common misspellings found");

  /* DATES */
  const MON="(?:jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)";
  const reMonY=new RegExp("\\b"+MON+"\\.?\\s+(?:19|20)\\d{2}\\b","gi");
  const reNum=/\b(?:0?[1-9]|1[0-2])\/(?:19|20)\d{2}\b/g;
  const reYR=/\b(?:19|20)\d{2}\s*(?:[-–—]|to)\s*(?:(?:19|20)\d{2}|present|current|now)\b/gi;
  const expText=[...(secs.experience||[]),...(secs.projects||[])].join("\n")||flat;
  const nMon=(expText.match(reMonY)||[]).length,nNum=(expText.match(reNum)||[]).length,nYr=(expText.replace(reMonY," ").match(reYR)||[]).length;
  const fmts=[nMon>0,nNum>0,nYr>0].filter(Boolean).length;
  const ranges=[...flat.matchAll(new RegExp("("+MON+"\\.?\\s+(?:19|20)\\d{2}|(?:0?[1-9]|1[0-2])\\/(?:19|20)\\d{2}|(?:19|20)\\d{2})\\s*(?:[-–—]|to)\\s*("+MON+"\\.?\\s+(?:19|20)\\d{2}|(?:0?[1-9]|1[0-2])\\/(?:19|20)\\d{2}|(?:19|20)\\d{2}|present|current|now)","gi"))].map(m=>m[0]);
  const hasExp=hasHead("experience")||/intern|engineer|developer|trainee/i.test(flat);
  if(hasExp&&nMon+nNum+nYr===0){
    const durationOnly=/\b\d+\s*(months?|yrs?|years?)\b/i.test(flat);
    add("dates","critical",durationOnly?"Experience shown as a duration, not dates":"No dates on experience","ATS calculates total years of experience from start and end dates. "+(durationOnly?"A duration like \"5 months\" cannot be added up, so the system records zero experience.":"With no dates it records zero experience."),"Write each role as Mon YYYY – Mon YYYY (for example Jan 2025 – Jun 2025), and Present for current jobs.",6);
  } else if(hasExp){
    ok("dates",ranges.length+" date range"+(ranges.length===1?"":"s")+" readable");
    if(/\b\d+\s*(months?)\b/i.test(flat)&&/\b\d+\s*months?\b/i.test(expText)) add("dates","warning","A role shows a duration instead of dates","One role says a number of months, which the ATS cannot place on a timeline.","Replace the duration with Mon YYYY – Present.",3);
  }

  const eduText=(secs.education||[]).join(" ");
  if(hasHead("education")&&!/(19|20)\d{2}/.test(eduText)) add("dates","warning","No graduation date in Education","Degree year is checked by early-career and eligibility filters.","Add the graduation month and year, expected if still studying.",2);
  else if(hasHead("education")) ok("dates","Education dates present");

  /* KEYWORDS */
  const foundSkills=SKILLS.filter(s=>hasTerm(all,s));
  let kw={mode:"generic",found:foundSkills,matched:[],missing:[],coverage:null};
  if(jd&&jd.trim().length>40){
    const jdl=jd.toLowerCase();
    const dict=SKILLS.filter(s=>hasTerm(jdl,s)).map(s=>({t:s,w:3}));
    const freq={};(jdl.match(/[a-z][a-z0-9+#.\/-]{2,}/g)||[]).forEach(t=>{t=t.replace(/[.\/-]+$/,"");if(t.length>3&&!STOP.has(t)&&!/^\d/.test(t))freq[t]=(freq[t]||0)+1});

  } else {
    const n=foundSkills.length;

    else if(n<10) add("keywords","tip","Skills could be broader ("+n+" found)","More recognised skills means more search hits.","Add tools you have used in projects, grouped by type.",4);
    else ok("keywords",n+" recognised skills found");
    add("keywords","tip","Paste a job description for a role match","Without a posting this score only checks general skill coverage. Real ATS ranking is relative to one specific job.","Paste the posting in the box on the left and scan again.",0);
  }

  Object.values(cats).forEach(c=>{c.score=Math.max(0,+(c.max-c.loss).toFixed(1))});

  const crit=issues.filter(i=>i.sev==="critical").length;

  if(crit>0&&total>64){total=64;capped=true}
  if(tooLittle) total=Math.min(total,15);
  return {total,cats,issues,crit,capped,bullets,jdUsed:kw.mode==="jd",meta,secs,headingLines,kw,info:{name:nameOk?first.trim():null,email,phone,linkedin,github,words,bullets:nb,ranges,pages:meta.pages,links:meta.links},text:flat};
}

const SKILL_GROUPS={
  "Languages":"java python javascript typescript c c++ c# go rust kotlin swift php ruby scala sql",
  "Web & frameworks":"html css react react.js angular vue node.js express spring boot spring hibernate jpa django flask fastapi rest restful graphql api responsive design microservices",
  "Databases":"mysql postgresql mongodb oracle redis nosql dbms etl data warehousing",
  "Cloud & DevOps":"aws azure gcp docker kubernetes jenkins ci/cd git github gitlab linux terraform ansible devops",
  "Testing & quality":"junit selenium postman testing unit testing quality assurance quality control six sigma root cause analysis iso 9001 spc fmea debugging automation",
  "Data & AI":"pandas numpy tensorflow pytorch machine learning deep learning nlp data analysis statistics tableau power bi excel ms excel generative ai prompt engineering analytics reporting spark hadoop kafka",
  "Core & tools":"data structures algorithms oop agile scrum jira problem solving communication leadership teamwork networking cybersecurity encryption cloud security eclipse vs code figma"
};
function groupSkills(list){
  const out={},used=new Set();
  for(const g in SKILL_GROUPS){
    const hit=list.filter(s=>!used.has(s)&&(" "+SKILL_GROUPS[g]+" ").includes(" "+s+" "));
    hit.forEach(s=>used.add(s));
    if(hit.length) out[g]=hit;
  }
  const rest=list.filter(s=>!used.has(s));
  if(rest.length) out["Other"]=rest;
  return out;
}
const ING={building:"Built",developing:"Developed",creating:"Created",implementing:"Implemented",designing:"Designed",managing:"Managed",writing:"Wrote",deploying:"Deployed",testing:"Tested",analyzing:"Analyzed",leading:"Led",preparing:"Prepared",working:"Developed",responsible:"Developed",helped:"Supported",assisted:"Supported"};
function buildReport(r,fileName,band){
  const L=[];const P=s=>L.push(s);
  const sev=s=>r.issues.filter(i=>i.sev===s).sort((a,b)=>b.loss-a.loss);
  const crit=sev("critical"),warn=sev("warning"),tips=sev("tip");
  const date=new Date().toISOString().slice(0,10);
  const fmt=i=>"- [ ] **"+i.title+"** ("+r.cats[i.cat].name+(i.loss?", recovers up to "+i.loss+" pts":"")+")\n  - Why it matters: "+i.why+"\n  - What to do: "+i.fix;
  P("# ATS Resume Report");
  P("");
  P("- File: "+(fileName||"Resume"));
  P("- Generated: "+date);
  P("- ATS score: **"+r.total+" / 100** ("+band+")");
  P("- Critical issues: "+crit.length+" | Warnings: "+warn.length+" | Tips: "+tips.length);
  P("- Job description used: "+(r.jdUsed?"Yes, keywords scored against it":"No, keywords scored on general skill coverage only"));
  if(r.capped) P("- Score capped at 64 because knockout problems are present. Fix every Critical item first.");
  P("");
  P("> No ATS vendor publishes a universal score and each employer configures its own filters. This score applies the checks Workday, Greenhouse, Lever and Taleo have in common: text extraction, section detection, date parsing, contact details and keyword match.");
  P("");
  P("## 1. Score breakdown");
  P("");
  P("| Category | Score | Max |");P("|---|---|---|");
  Object.values(r.cats).forEach(c=>P("| "+c.name+" | "+c.score+" | "+c.max+" |"));
  P("");
  const gain=Math.round(r.issues.reduce((a,i)=>a+i.loss,0));
  P("Potential gain if every item below is fixed: about "+Math.min(gain,100-r.total)+" points.");
  P("");

function mdBlocks(md){
  const B=[],L=md.split("\n");let i=0;
  while(i<L.length){
    const l=L[i];
    if(l.startsWith("```")){const c=[];i++;while(i<L.length&&!L[i].startsWith("```")){c.push(L[i]);i++}i++;B.push({k:"code",lines:c});continue}
    if(l.startsWith("## ")){B.push({k:"h2",t:l.slice(3)});i++;continue}
    if(l.startsWith("# ")){B.push({k:"h1",t:l.slice(2)});i++;continue}
    if(l.startsWith("> ")){B.push({k:"q",t:l.slice(2)});i++;continue}
    if(l.startsWith("|")){const rows=[];while(i<L.length&&L[i].startsWith("|")){if(!/^\|[-| ]+\|$/.test(L[i]))rows.push(L[i].split("|").slice(1,-1).map(c=>c.trim()));i++}B.push({k:"table",rows});continue}
    if(/^- /.test(l)){const box=l.startsWith("- [ ] ");const it={k:"li",t:l.slice(box?6:2),box,sub:[]};i++;while(i<L.length&&/^  - /.test(L[i])){it.sub.push(L[i].slice(4));i++}B.push(it);continue}
    if(!l.trim()){i++;continue}
    B.push({k:"p",t:l});i++;
  }
  return B;
}
const plain=s=>String(s).replace(/\*\*/g,"").replace(/`/g,"");
function runs(s){const out=[];String(s).replace(/`/g,"").split("**").forEach((p,i)=>{if(p)out.push({t:p,b:i%2===1})});return out}
const MAPCH={8211:"-",8212:"-",8722:"-",8594:"->",8216:"'",8217:"'",8220:'"',8221:'"',8226:"-",8230:"..."};
function latin(s){let o="";for(const ch of plain(s)){const c=ch.charCodeAt(0);if((c>=32&&c<=126)||(c>=160&&c<=255))o+=ch;else if(MAPCH[c])o+=MAPCH[c];else if(c===9)o+=" "}return o}

}

const BUL=String.fromCharCode(8226);
function parseResume(text){
  const L=text.split("\n").map(l=>l.replace(/\s+$/,"")),out=[];
  const HEAD=/^(SUMMARY|SKILLS|EXPERIENCE|PROJECTS|EDUCATION|CERTIFICATIONS|LANGUAGES)$/;
  const DATE=/^(.*\S)\s+-\s+((?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+\d{4})$/;
  let sec="",idx=0,eduFirst=true;
  L.forEach(l=>{
    const tr=l.trim();if(!tr)return;
    if(idx===0){out.push({t:"name",text:tr});idx++;return}
    idx++;
    if(HEAD.test(tr)){sec=tr;out.push({t:"sec",text:tr});return}
    if(!sec){out.push({t:"contact",text:tr});return}
    if(tr.startsWith(BUL+" ")){out.push({t:"bullet",text:tr.slice(2)});return}
    if(sec==="SUMMARY"||sec==="CERTIFICATIONS"||sec==="LANGUAGES"){out.push({t:"para",text:tr});return}
    const kv=tr.match(/^([A-Za-z][A-Za-z &\/()-]{1,40}):\s+(.+)$/);
    if(sec==="SKILLS"||(kv&&sec==="EDUCATION")){if(kv)out.push({t:"kv",label:kv[1]+":",value:kv[2]});else out.push({t:"para",text:tr});return}
    if(sec==="EDUCATION"){
      if(eduFirst){eduFirst=false;out.push({t:"row",left:tr,right:"",style:"bold"});return}
      const q=tr.split(" | ");out.push({t:"row",left:q[0],right:q[1]||"",style:"normal"});return
    }
    const pipe=tr.indexOf(" | ");
    if(pipe>=0){out.push({t:"row",left:tr.slice(0,pipe),right:tr.slice(pipe+3),style:"italic"});return}
    const m=tr.match(DATE);
    if(m){out.push({t:"row",left:m[1],right:m[2],style:"bold"});return}
    out.push({t:"row",left:tr,right:"",style:"bold"});
  });
  return out;
}

function toResumePdf(text){
  if(!window.jspdf) throw new Error("lib");
  const items=parseResume(text);
  const render=sc=>{
    const d=new window.jspdf.jsPDF({unit:"pt",format:"a4"});
    const W=595.28,H=841.89,M=38,CW=W-2*M,fs=9.8*sc,lh=fs*1.32;
    let y=M,prev="";
    const ensure=h=>{if(y+h>H-M){d.addPage();y=M}};
    const setf=(st,size)=>{d.setFont("helvetica",st);d.setFontSize(size)};
    const wrap=(s,w,st,size)=>{setf(st,size);return d.splitTextToSize(latin(s),w)};
    items.forEach(it=>{
      if(it.t==="name"){setf("bold",21*sc);d.setTextColor(0);d.text(latin(it.text),W/2,y+17*sc,{align:"center"});y+=27*sc}
      else if(it.t==="contact"){setf("normal",9*sc);d.setTextColor(70);d.text(latin(it.text),W/2,y+8*sc,{align:"center"});y+=12.5*sc}
      else if(it.t==="sec"){y+=8*sc;ensure(26);setf("bold",10.8*sc);d.setTextColor(0);d.text(it.text,M,y+9*sc);y+=13*sc;d.setDrawColor(40);d.setLineWidth(0.7);d.line(M,y,W-M,y);y+=4*sc}
      else if(it.t==="para"){d.setTextColor(25);wrap(it.text,CW,"normal",fs).forEach(l=>{ensure(lh);setf("normal",fs);d.text(l,M,y+fs);y+=lh})}
      else if(it.t==="kv"){
        setf("bold",fs);const lw=d.getTextWidth(latin(it.label))+4;
        const ls=wrap(it.value,CW-lw,"normal",fs);ensure(lh*ls.length);
        setf("bold",fs);d.setTextColor(0);d.text(latin(it.label),M,y+fs);
        d.setTextColor(25);ls.forEach((l,i)=>{setf("normal",fs);d.text(l,M+lw,y+fs+i*lh)});
        y+=lh*ls.length;
      }
      else if(it.t==="bullet"){
        const ls=wrap(it.text,CW-16,"normal",fs);ensure(lh*ls.length);
        d.setFillColor(25);d.circle(M+7,y+fs*0.62,1.1,"F");
        d.setTextColor(25);ls.forEach((l,i)=>{setf("normal",fs);d.text(l,M+16,y+fs+i*lh)});
        y+=lh*ls.length;
      }
      else if(it.t==="row"){
        if(it.style==="bold"&&prev==="bullet")y+=4*sc;
        setf("normal",fs);const rw=it.right?d.getTextWidth(latin(it.right)):0;
        const sz=it.style==="bold"?fs*1.06:fs;
        const ls=wrap(it.left,CW-rw-12,it.style,sz);ensure(lh*ls.length);
        d.setTextColor(it.style==="bold"?0:25);
        ls.forEach((l,i)=>{setf(it.style,sz);d.text(l,M,y+sz+i*lh)});
        if(it.right){setf("normal",fs);d.setTextColor(70);d.text(latin(it.right),W-M,y+sz,{align:"right"})}
        y+=lh*ls.length;
      }
      prev=it.t;
    });
    return d;
  };
  let d;
  for(const sc of [1,0.96,0.92,0.88,0.84]){d=render(sc);if(d.getNumberOfPages()===1)break}
  return d.output("arraybuffer");
}

async function toResumeDocx(text){
  if(!window.JSZip) throw new Error("lib");
  const items=parseResume(text);
  const x=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const r=(t,o)=>{o=o||{};return '<w:r><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/>'+(o.b?"<w:b/>":"")+(o.i?"<w:i/>":"")+(o.color?'<w:color w:val="'+o.color+'"/>':"")+'<w:sz w:val="'+(o.sz||20)+'"/></w:rPr><w:t xml:space="preserve">'+x(t)+"</w:t></w:r>"};
  const tab='<w:r><w:tab/></w:r>';
  const p=(inner,o)=>{o=o||{};return "<w:p><w:pPr>"+(o.keep?"<w:keepNext/>":"")+(o.rule?'<w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="282828"/></w:pBdr>':"")+(o.rtab?'<w:tabs><w:tab w:val="right" w:pos="9900"/></w:tabs>':"")+'<w:spacing w:before="'+(o.before||0)+'" w:after="'+(o.after==null?20:o.after)+'"/>'+(o.ind?'<w:ind w:left="'+o.ind+'" w:hanging="'+(o.hang||0)+'"/>':"")+(o.center?'<w:jc w:val="center"/>':"")+"</w:pPr>"+inner+"</w:p>"};
  const out=[];let prev="";
  items.forEach(it=>{
    if(it.t==="name")out.push(p(r(it.text,{b:1,sz:42}),{center:1,after:40}));
    else if(it.t==="contact")out.push(p(r(it.text,{sz:18,color:"464646"}),{center:1,after:10}));
    else if(it.t==="sec")out.push(p(r(it.text,{b:1,sz:21}),{rule:1,keep:1,before:150,after:60}));
    else if(it.t==="para")out.push(p(r(it.text),{after:30}));
    else if(it.t==="kv")out.push(p(r(it.label+" ",{b:1})+r(it.value),{after:20}));
    else if(it.t==="bullet")out.push(p(r(BUL)+tab+r(it.text),{ind:360,hang:240,after:20}));
    else if(it.t==="row"){
      const o={rtab:1,after:10,before:(it.style==="bold"&&prev==="bullet")?90:30,keep:1};
      out.push(p(r(it.left,{b:it.style==="bold",i:it.style==="italic",sz:it.style==="bold"?21:20})+(it.right?tab+r(it.right,{color:"464646"}):""),o));
    }
    prev=it.t;
  });
  const doc='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+out.join("")+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="700" w:right="1000" w:bottom="700" w:left="1000" w:header="500" w:footer="500" w:gutter="0"/></w:sectPr></w:body></w:document>';
  const z=new JSZip();
  z.file("[Content_Types].xml",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  z.file("_rels/.rels",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  z.file("word/document.xml",doc);
  return z.generateAsync({type:"arraybuffer",compression:"DEFLATE"});
}

function toCsv(r){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=[["Severity","Category","Issue","Points recoverable","Why it matters","How to fix"]];
  r.issues.forEach(i=>rows.push([i.sev,r.cats[i.cat].name,i.title,i.loss,i.why,i.fix]));
  return rows.map(a=>a.map(q).join(",")).join("\r\n");
}
function toJson(r,fileName,verdict){
  return JSON.stringify({file:fileName||"Resume",generated:new Date().toISOString().slice(0,10),score:r.total,verdict,capped:r.capped,
    categories:Object.values(r.cats).map(c=>({name:c.name,score:c.score,max:c.max})),
    issues:r.issues.map(i=>({severity:i.sev,category:r.cats[i.cat].name,title:i.title,pointsRecoverable:i.loss,why:i.why,fix:i.fix})),
    bullets:r.bullets.map(b=>({section:b.sec,startsWithActionVerb:!!b.verb,hasNumber:!!b.metric,text:b.t})),
    keywords:{mode:r.kw.mode,found:r.kw.found,matched:r.kw.matched,missing:r.kw.missing,coverage:r.kw.coverage},
    extracted:{name:r.info.name,email:r.info.email,phone:r.info.phone,linkedin:r.info.linkedin,github:r.info.github,dateRanges:r.info.ranges,words:r.info.words,pages:r.info.pages},
    resumeText:r.text},null,2);
}
const FORMATS={
  pdf:{ext:"pdf",label:"PDF",mime:"application/pdf"},
  docx:{ext:"docx",label:"Word",mime:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"},
  md:{ext:"md",label:"Markdown",mime:"text/markdown",text:true},
  html:{ext:"html",label:"HTML",mime:"text/html",text:true},
  txt:{ext:"txt",label:"plain text",mime:"text/plain",text:true},
  json:{ext:"json",label:"JSON",mime:"application/json",text:true},
  csv:{ext:"csv",label:"CSV",mime:"text/csv",text:true}
};
async function makeFile(fmt,r,fileName,verdict){
  const md=buildReport(r,fileName,verdict);
  if(fmt==="md")return md;
  if(fmt==="txt")return plain(md);
  if(fmt==="json")return toJson(r,fileName,verdict);
  if(fmt==="csv")return toCsv(r);
  const B=mdBlocks(md);
  if(fmt==="html")return toHtml(B,"ATS Resume Report");
  if(fmt==="pdf")return toPdf(B);
  if(fmt==="docx")return toDocx(B);
  throw new Error("format");
}
async function saveFile(name,data,mime){
  let dl=null;
  try{dl=window.claude&&claude.use?await claude.use("downloads"):null}catch(e){dl=null}
  if(dl){await dl.save({filename:name,data});return}
  const blob=data instanceof Blob?data:new Blob([data],{type:mime});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

function resumeBlocks(text){
  const HEAD=/^(SUMMARY|SKILLS|EXPERIENCE|PROJECTS|EDUCATION|CERTIFICATIONS)$/;
  return text.split("\n").map((l,i)=>l.trim()?(i===0?{k:"h1",t:l}:HEAD.test(l.trim())?{k:"h2",t:l}:{k:"p",t:l}):null).filter(Boolean);
}
function exampleCard(k){
  const e=EX[k];
  return '<div class="card"><h2>'+e.label+' resume example</h2><p class="note" style="margin:0 0 10px">One column, standard headings, dates as Mon YYYY, and an action verb plus a number in every bullet. All names, employers and figures are made up. Replace them with your own facts.</p><div class="dlrow"><label for="exFmt" class="tag">Format</label><select id="exFmt"><option value="docx">Word (.docx)</option><option value="pdf">PDF (.pdf)</option><option value="txt">Plain text (.txt)</option></select><button class="btn2" id="exDl" style="background:var(--accent);color:var(--accent-fg);border-color:var(--accent)">Download this resume</button><button class="btn2" id="exCopy">Copy text</button></div><div id="exMsg" class="note" role="status"></div><pre class="txt">'+h(e.text)+'</pre></div>';
}

/* ---------- Rendering ---------- */
const colour=v=>v>=80?"var(--good)":v>=65?"var(--warn)":"var(--crit)";
function render(r,fileName,example){
  const band=r.total>=80?["v-good","Likely to pass"]:r.total>=65?["v-warn","Borderline"]:["v-crit","Likely to be rejected"];
  const C=2*Math.PI*72,off=C*(1-r.total/100);
  const n={critical:0,warning:0,tip:0};r.issues.forEach(i=>n[i.sev]++);
  const order={critical:0,warning:1,tip:2};
  const sorted=[...r.issues].sort((a,b)=>order[a.sev]-order[b.sev]||b.loss-a.loss);
  const topFix=[...r.issues].filter(i=>i.loss>0).sort((a,b)=>b.loss-a.loss).slice(0,5);
  const recover=Math.min(100-r.total,Math.round(topFix.reduce((a,i)=>a+i.loss,0)));
  const catHTML=Object.values(r.cats).map(c=>{
    const p=c.score/c.max*100;
    return '<div class="cat"><div class="row"><span>'+h(c.name)+'</span><span>'+c.score+' / '+c.max+'</span></div><div class="bar"><i style="width:'+p+'%;background:'+colour(p)+'"></i></div></div>';
  }).join("");
  const passAll=Object.values(r.cats).flatMap(c=>c.pass.map(p=>p));
  const issueHTML=sorted.map(i=>'<article class="issue '+i.sev+'" data-sev="'+i.sev+'"><div class="hd"><span class="sev">'+i.sev+'</span><span class="t">'+h(i.title)+'</span><span class="cat-l">'+h(r.cats[i.cat].name)+(i.loss?' · −'+i.loss+' pts':'')+'</span></div><p>'+h(i.why)+'</p><p class="fix"><b>Fix:</b> '+h(i.fix)+'</p></article>').join("");
  let kwHTML;
  if(r.kw.mode==="jd"){
    kwHTML='<p style="margin:0 0 10px;color:var(--muted);font-size:14px">Job match: <b style="color:var(--fg)">'+Math.round(r.kw.coverage*100)+'%</b></p>'+
      '<h3 style="font-size:13px">Found in your resume</h3><div class="chips" style="margin-bottom:14px">'+(r.kw.matched.map(k=>'<span class="chip ok">'+h(k)+'</span>').join("")||'<span class="note">None</span>')+'</div>'+
      '<h3 style="font-size:13px">Missing from your resume</h3><div class="chips">'+(r.kw.missing.map(k=>'<span class="chip miss">'+h(k)+'</span>').join("")||'<span class="note">None</span>')+'</div>';
  } else {
    kwHTML='<p style="margin:0 0 10px;color:var(--muted);font-size:14px">Recognised skills in your resume ('+r.kw.found.length+'). Paste a job description to see which role keywords are missing.</p><div class="chips">'+(r.kw.found.map(k=>'<span class="chip neutral">'+h(k)+'</span>').join("")||'<span class="note">None recognised</span>')+'</div>';
  }
  const secList=Object.keys(r.secs).filter(k=>k!=="_top").map(k=>'<span class="chip ok">'+h(SECNAME[k])+' · '+r.secs[k].length+' lines</span>').join("");
  const missSec=["summary","experience","education","skills"].filter(k=>!r.secs[k]||!r.secs[k].length).map(k=>'<span class="chip miss">'+SECNAME[k]+' missing</span>').join("");
  const I=r.info;
  const prof='<dl class="kv"><dt>Name</dt><dd'+(I.name?'':' class="bad"')+'>'+h(I.name||"Not detected")+'</dd><dt>Email</dt><dd'+(I.email?'':' class="bad"')+'>'+h(I.email||"Not detected")+'</dd><dt>Phone</dt><dd'+(I.phone?'':' class="bad"')+'>'+h(I.phone||"Not detected")+'</dd><dt>LinkedIn</dt><dd'+(I.linkedin?'':' class="bad"')+'>'+h(I.linkedin||"Not detected")+'</dd><dt>GitHub</dt><dd>'+h(I.github||"Not detected")+'</dd><dt>Date ranges</dt><dd'+(I.ranges.length?'':' class="bad"')+'>'+(I.ranges.length?h(I.ranges.join("; ")):"None detected")+'</dd><dt>Sections</dt><dd><div class="chips">'+secList+missSec+'</div></dd><dt>Word count</dt><dd>'+I.words+(I.pages?' · '+I.pages+' page'+(I.pages>1?'s':''):'')+'</dd></dl>';
  const res=$("#results");
  res.innerHTML=
   (example?'<div class="sample-note">Example resume built to score 100/100. Replace the details with your own facts.</div>':'')+
   '<div class="card hero"><div class="ring"><svg viewBox="0 0 168 168" aria-hidden="true"><circle cx="84" cy="84" r="72" fill="none" stroke="var(--surface2)" stroke-width="14"/><circle cx="84" cy="84" r="72" fill="none" stroke="'+colour(r.total)+'" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg><div class="num"><b>'+r.total+'</b><span>ATS SCORE / 100</span></div></div>'+
   '<div><span class="verdict '+band[0]+'">'+band[1]+'</span><h3>'+h(fileName||"Resume")+'</h3><p style="margin:4px 0 0;color:var(--muted);font-size:14px">'+(r.capped?'Score capped at 64 because knockout problems are present. ATS filters reject on these before keyword ranking starts.':r.total>=80?'Your resume parses cleanly and ranks well. Tailor keywords to each posting.':'Fixing the items below can add about '+recover+' points.')+'</p><div class="counts"><span style="color:var(--crit)"><i>'+n.critical+'</i> critical</span><span style="color:var(--warn)"><i>'+n.warning+'</i> warnings</span><span style="color:var(--tip)"><i>'+n.tip+'</i> tips</span></div><div style="margin-top:12px"><div class="dlrow"><label for="fmt" class="tag">Format</label><select id="fmt"><option value="pdf">PDF (.pdf)</option><option value="docx">Word (.docx)</option><option value="md">Markdown (.md), best to give to Claude</option><option value="html">Web page (.html)</option><option value="txt">Plain text (.txt)</option><option value="json">JSON (.json)</option><option value="csv">Issues list (.csv)</option></select><button class="btn2" id="dlRep" style="background:var(--accent);color:var(--accent-fg);border-color:var(--accent)">Download report</button><button class="btn2" id="copyRep">Copy report</button></div></div><div id="dlMsg" class="note" role="status"></div><div id="dlFallback" hidden><p class="note">Saving files is not available in this view. Select all and copy the report below, then paste it to Claude.</p><textarea id="dlText" readonly style="min-height:160px"></textarea></div></div></div>'+
   (topFix.length?'<div class="card"><h2>Fix these first</h2><ol class="fixes">'+topFix.map(i=>'<li><span class="pts">+'+i.loss+'</span><div><b>'+h(i.title)+'</b><span>'+h(i.fix)+'</span></div></li>').join("")+'</ol></div>':'')+
   (example?exampleCard(example):'')+
   '<div class="card"><h2>Score breakdown</h2><div class="cats">'+catHTML+'</div></div>'+
   '<div class="card"><h2>All issues ('+r.issues.length+')</h2><div class="filters" id="filters"><button class="btn2" aria-pressed="true" data-f="all">All</button><button class="btn2" aria-pressed="false" data-f="critical">Critical</button><button class="btn2" aria-pressed="false" data-f="warning">Warnings</button><button class="btn2" aria-pressed="false" data-f="tip">Tips</button></div><div id="issueList">'+(issueHTML||'<p class="note">No issues found.</p>')+'</div></div>'+
   '<div class="two"><div class="card"><h2>Keyword match</h2>'+kwHTML+'</div><div class="card"><h2>What the ATS extracted</h2>'+prof+'</div></div>'+
   (passAll.length?'<div class="card"><h2>What is working</h2><ul class="pass">'+passAll.map(p=>'<li>'+h(p)+'</li>').join("")+'</ul></div>':'')+
   '<div class="card"><details><summary>Plain text as the parser sees it</summary><pre class="txt">'+h(r.text)+'</pre></details></div>'+
   '<div class="card"><details><summary>How this score is calculated</summary><p class="note" style="margin-top:10px">No ATS vendor publishes a universal score, and each employer configures its own filters, so no tool can show the exact number a company will assign. This scanner applies the checks those systems have in common. Points: format and parsing 20, contact 10, sections 15, experience content 20, keywords 25 (against your job description when pasted), dates 10. Knockout problems such as unreadable text, a missing email or phone, no experience dates, or a missing Experience or Education section cap the total at 64, because real systems filter on those before ranking.</p></details></div>';
  $("#filters").addEventListener("click",e=>{
    const b=e.target.closest("button");if(!b)return;
    document.querySelectorAll("#filters button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    document.querySelectorAll("#issueList .issue").forEach(a=>{a.hidden=b.dataset.f!=="all"&&a.dataset.sev!==b.dataset.f});
  });
  $("#dlRep").addEventListener("click",async()=>{
    const msg=$("#dlMsg"),fb=$("#dlFallback");
    const t=buildReport(r,fileName,band[1]);
    const base=(fileName||"resume").replace(/\.[^.]+$/,"").replace(/[^A-Za-z0-9_-]+/g,"_");
    const f=FORMATS[$("#fmt").value];
    msg.textContent="Preparing "+f.label+" ...";fb.hidden=true;
    try{
      const data=await makeFile($("#fmt").value,r,fileName,band[1]);
      await saveFile("ATS-Report_"+base+"."+f.ext,data,f.mime);
      msg.textContent=f.label+" report ready. Give it to Claude with your resume and ask it to fix everything in it.";
    }catch(x){
      if(x&&x.code==="declined") msg.textContent="Save cancelled.";
      else if(f.text){msg.textContent="Saving is blocked in this view. Copy the text below instead.";fb.hidden=false;$("#dlText").value=typeof t==="string"?await makeFile($("#fmt").value,r,fileName,band[1]):t}
      else msg.textContent="Could not create the "+f.label+" file here ("+(x&&x.message||"error")+"). Choose Markdown or HTML instead.";
    }
  });
  $("#copyRep").addEventListener("click",async e=>{
    const t=buildReport(r,fileName,band[1]);
    const btn=e.currentTarget;
    try{await navigator.clipboard.writeText(t);btn.textContent="Copied"}catch(x){btn.textContent="Copy blocked: select text manually"}
    setTimeout(()=>btn.textContent="Copy report",2000);
  });
  if(example){
    $("#exCopy").addEventListener("click",async e=>{
      const b=e.currentTarget;
      try{await navigator.clipboard.writeText(EX[example].text);b.textContent="Copied"}catch(x){b.textContent="Copy blocked"}
      setTimeout(()=>b.textContent="Copy text",2000);
    });
    $("#exDl").addEventListener("click",async()=>{
      const k=$("#exFmt").value,msg=$("#exMsg"),e=EX[example];
      msg.textContent="Preparing ...";
      try{
        const data=k==="txt"?e.text:k==="pdf"?toResumePdf(e.text):await toResumeDocx(e.text);
        await saveFile(e.file+"."+k,data,k==="txt"?"text/plain":k==="pdf"?"application/pdf":FORMATS.docx.mime);
        msg.textContent="Saved. Edit it with your own details, then scan it to confirm the score.";
      }catch(x){msg.textContent=(x&&x.code==="declined")?"Save cancelled.":"Could not create the file here. Use Copy text instead."}
    });
  }
}

/* ---------- Wiring ---------- */
const TXTMETA={pages:1,columns:false,links:[],tables:0,images:0,type:"txt"};
let current=null;
const err=$("#err");
function run(){
  err.textContent="";
  const pasted=$("#paste").value.trim();
  let src=current;
  if(pasted&&!(current&&current.file)) src={text:pasted,meta:Object.assign({},TXTMETA,{pages:null}),name:"Pasted text"};
  if(!src){err.textContent="Upload a resume or paste text first.";return}
  const jd=src.example?"":$("#jd").value;
  const r=analyze(src.text,src.meta,jd,src.file?src.name:"");
  render(r,src.name,src.example||null);
}
function loadExample(k){
  err.textContent="";$("#paste").value="";
  current={text:EX[k].text,meta:TXTMETA,name:EX[k].label+" example resume",example:k};
  $("#fileStatus").textContent="Showing the "+EX[k].label.toLowerCase()+" example resume.";
  run();
  $("#results").scrollIntoView({behavior:"smooth",block:"start"});
}
function renderEmpty(){
  $("#results").innerHTML='<div class="card"><h2>Scan a resume</h2><h3>See what an ATS sees</h3><p class="note" style="font-size:14px">Upload a PDF, DOCX or TXT resume, or paste its text, then press Scan resume. Add a job description for a role-specific keyword match. You get a score out of 100, the issues that get resumes rejected, and a downloadable fix report.</p><p class="note" style="font-size:14px">Want a model to copy? Open the fresher or the experienced example on the left. Both score 100/100.</p></div>';
}
async function handle(file){
  err.textContent="";const st=$("#fileStatus");st.textContent="Reading "+file.name+" ...";
  try{
    const out=await readAny(file);
    current={text:out.text,meta:out.meta,name:file.name,file:true,sample:false};
    st.textContent=file.name+" · "+(out.text.match(/\S+/g)||[]).length+" words read";
    $("#paste").value="";
    run();
    $("#results").scrollIntoView({behavior:"smooth",block:"start"});
  }catch(e){st.textContent="Could not read "+file.name;err.textContent=e.message||String(e)}
}
$("#file").addEventListener("change",e=>{if(e.target.files[0])handle(e.target.files[0])});
const drop=$("#drop");
["dragenter","dragover"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",e=>{const f=e.dataTransfer.files[0];if(f)handle(f)});
$("#scan").addEventListener("click",()=>{
  const b=$("#scan");b.disabled=true;
  try{run()}catch(e){err.textContent="Scan failed: "+e.message}
  b.disabled=false;
});
$("#exFresher").addEventListener("click",()=>loadExample("fresher"));
$("#exExp").addEventListener("click",()=>loadExample("experienced"));
renderEmpty();
})();
</script>
